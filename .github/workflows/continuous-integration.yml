name: Continuous Integration
on:
  push:
    paths-ignore:
      - 'images/**'
      - 'scripts/**'
      - 'README.md'
      - 'LICENSE'
      - '.prettierrc'
      - '.bashrc'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'images/**'
      - 'scripts/**'
      - 'README.md'
      - 'LICENSE'
      - '.prettierrc'
      - '.bashrc'
      - '.gitignore'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: mvn clean test
